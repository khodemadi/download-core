[package]
name = "rust-download-core"
version = "0.1.0"
edition = "2026"
description = "A fast, resumable, segmented HTTP download core written in Rust."
license = "MIT"
readme = "README.md"
repository = "https://github.com/khodemadi/download-core"
keywords = ["download-manager", "downloader", "http", "rust", "async"]
categories = ["network-programming", "asynchronous"]

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"