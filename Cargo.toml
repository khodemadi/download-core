[package]
name = "download-core"
version = "0.1.0"
edition = "2024"

authors = ["khodemadi"]
license = "MIT"
description = "A fast, resumable, segmented HTTP download core written in Rust."
repository = "https://github.com/khodemadi/download-core"
homepage = "https://github.com/khodemadi/download-core"
readme = "README.md"

keywords = [
    "download",
    "http",
    "async",
    "tokio",
    "network",
]

categories = [
    "network-programming",
    "asynchronous",
]

[lib]
path = "crs/lib.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "http2",
] }

tokio = { version = "1.47", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
    "sync",
    "time",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sha2 = "0.10"

thiserror = "2.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
] }

url = "2.5"

[dev-dependencies]
tokio = { version = "1.47", features = ["full"] }

criterion = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true